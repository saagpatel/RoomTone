name: RoomTone
options:
  bundleIdPrefix: com.roomtone
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"

targets:
  RoomTone:
    type: application
    platform: iOS
    sources:
      - path: RoomTone
    resources:
      - path: RoomTone/Resources
    info:
      path: RoomTone/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Room Tone uses the camera to map room geometry for acoustic synthesis — no images are stored or transmitted."
        UIBackgroundModes:
          - audio
        UIRequiredDeviceCapabilities:
          - lidar-sensor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomtone.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies: []
    entitlements:
      path: RoomTone/Resources/RoomTone.entitlements

  RoomToneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoomToneTests
    dependencies:
      - target: RoomTone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomtone.app.tests
