name: RoomTone
options:
  bundleIdPrefix: com.romtone
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 2
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"

targets:
  RoomTone:
    type: application
    platform: iOS
    sources:
      - path: RoomTone
    resources:
      - path: RoomTone/Resources
    info:
      path: RoomTone/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: NO
        NSCameraUsageDescription: "Room Tone uses the camera to map room geometry for acoustic synthesis — no images are stored or transmitted."
        UIRequiredDeviceCapabilities:
          - arkit
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romtone.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3TGZFKFNA4
    dependencies: []
    entitlements:
      path: RoomTone/Resources/RoomTone.entitlements

  RoomToneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoomToneTests
    dependencies:
      - target: RoomTone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.romtone.app.tests

schemes:
  RoomTone:
    build:
      targets:
        RoomTone: all
    test:
      targets:
        - RoomToneTests
    archive:
      config: Release
